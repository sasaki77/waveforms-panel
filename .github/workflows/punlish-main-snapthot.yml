name: Publish Snapshot (main)

on:
  push:
    branches:
      - main

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ZIP_NAME: sasaki77-waveforms-panel
      NODE_VERSION: '24'
      TAG_NAME: main-snapshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Archive Release Files
        run: |
          REPO_DIRECTORY=${PWD##*/}
          pushd ../
          zip -r $REPO_DIRECTORY/${{ env.ZIP_NAME }}.zip $REPO_DIRECTORY -x @$REPO_DIRECTORY/exclude.txt
          popd

      - name: Update Tag and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Force update the tag to the current commit
          git tag -f ${{ env.TAG_NAME }}
          git push origin ${{ env.TAG_NAME }} --force

          # Try to update existing release, otherwise create a new one
          gh release upload ${{ env.TAG_NAME }} ./${{ env.ZIP_NAME }}.zip --clobber || \
          gh release create ${{ env.TAG_NAME }} ./${{ env.ZIP_NAME }}.zip --prerelease

          gh release edit ${{ env.TAG_NAME }} \
            --title "Main Snapshot (latest)" \
            --notes "Auto-generated snapshot from main branch."
